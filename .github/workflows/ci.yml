name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Manifest check
        run: node scripts/check-manifest.mjs

      - name: Build dry run
        run: |
          out="$RUNNER_TEMP/dist"
          node scripts/build.mjs --channel dev --out "$out"
          unzip -l "$out/dev/enhanced-stash-player.zip"
          unzip -tq "$out/dev/enhanced-stash-player.zip"
          cat "$out/dev/index.yml"
